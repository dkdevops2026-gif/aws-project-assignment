version: '3.8'

services:
  user-service:
    build: ./user-service
    restart: always
    environment:
      - PORT=3000
    networks:
      - app-network

  product-service:
    build: ./product-service
    restart: always
    environment:
      - PORT=3001
    networks:
      - app-network

  order-service:
    build: ./order-service
    restart: always
    environment:
      - PORT=3002
    networks:
      - app-network

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
